<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151516" />
    <title>Zephyrlea · Molecule Editor</title>
    <script>
      // Apply the stored theme before first paint so the shell never flashes.
      try {
        var stored = JSON.parse(localStorage.getItem('zephyrlea.settings') || '{}');
        var theme = stored && stored.theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="stylesheet" href="/vendor/kekule/kekule.css" />
    <!-- Kekule.js 1.0.4 (MIT), vendored from the official npm dist bundle. -->
    <script src="/vendor/kekule/kekule.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
